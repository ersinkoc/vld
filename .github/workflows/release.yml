name: Release

# Opens the GitHub Release for a vX.Y.Z tag.
#
# npm publishing is deliberately NOT part of this workflow. Releases are
# published from the maintainer machine (`npm run release`, or an explicit
# `npm publish`), because:
# - `release:check` includes the machine-relative benchmark guards, which are
#   noise on shared CI runners and would make tag pushes flaky;
# - the repo .npmrc sets ignore-scripts=true, so npm lifecycle hooks
#   (prepack/prepublishOnly) never run on publish anyway - scripts/release.cjs
#   runs the gate and a fresh build explicitly instead.
# The previous version of this file published from CI as a second publisher,
# which raced the local publish and went red on every tag with
# "You cannot publish over the previously published versions".
#
# What a tag push does now:
# 1. installs deps and builds dist (the old job installed with
#    --ignore-scripts and packed a 4-file tarball with no runtime code);
# 2. validates the tag against package.json, the CHANGELOG entry, and the
#    packed tarball through verify:package;
# 3. reports the npm registry state for this version as a warning when the
#    version is not published/latest yet (tag-first publishing is allowed);
# 4. creates the GitHub Release from the matching CHANGELOG section.
#
# workflow_dispatch runs the same job against an existing tag: `tag` selects
# the tag (the ref is a branch there, so `github.ref_name` cannot be used) and
# `dry_run` (default true) stops before the release is created/updated.
#
# Required config: repository Settings -> Actions -> General -> Workflow
# permissions "Read and write permissions" (for Release creation). No npm
# token and no id-token permission are needed.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to release'
        type: string
        required: true
      dry_run:
        description: 'Validate only - build, checks and release notes, no GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatch run is on a branch; check out the tag it names so the
          # build and the tag/version guards all see the released tree.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        # Plain single-quoted JS strings only: no $, backticks, or double
        # quotes inside the node payload, so bash double-quoting needs no
        # escapes and YAML block scalars keep the text verbatim.
        run: |
          node -e "
          const fs = require('fs');
          const isTagPush = process.env.GITHUB_REF.startsWith('refs/tags/');
          const tag = isTagPush ? process.env.GITHUB_REF_NAME : (process.env.INPUT_TAG || '').trim();
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/.test(tag)) {
            console.error('No usable release tag: ' + (tag || '(empty)') + '. Pass the tag input as vX.Y.Z.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\n');
          console.log('Release tag: ' + tag);
          "

      - name: Verify tag matches package.json version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (tag !== 'v' + pkg.version) {
            console.error('Tag ' + tag + ' does not match package.json version ' + pkg.version + '. Aborting.');
            process.exit(1);
          }
          console.log('Tag ' + tag + ' matches package.json version ' + pkg.version);
          "

      - name: Verify CHANGELOG has an entry for this version
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = '## [' + pkg.version + ']';
          if (!changelog.includes(heading)) {
            console.error('CHANGELOG.md has no ' + heading + ' heading. Aborting.');
            process.exit(1);
          }
          console.log('CHANGELOG.md contains ' + heading);
          "

      # A tag push must ship real runtime code: build dist before packing, then
      # let verify:package assert every exports/bin target is in the tarball.
      - name: Build
        run: npm run build

      - name: Verify packed tarball
        run: npm run verify:package

      # Publishing is manual, so this never fails the tag: it only makes the
      # gap visible on the run summary and as an annotation.
      - name: Report npm registry state
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node -e "
          (async () => {
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const url = 'https://registry.npmjs.org/' + pkg.name.replace('/', '%2F') + '/latest';
            let latest = 'unknown';
            try {
              const response = await fetch(url, { headers: { accept: 'application/json' } });
              latest = response.ok ? (await response.json()).version : 'not published';
            } catch (error) {
              latest = 'lookup failed (' + error.message + ')';
            }
            console.log('npm latest: ' + latest + ' | release tag: ' + process.env.RELEASE_TAG);
            if (latest !== pkg.version) {
              console.log('::warning::' + pkg.name + '@' + pkg.version + ' is not npm latest (found ' + latest + '). The GitHub Release still opens; publish it from the maintainer machine with npm publish --access public.');
            }
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                '### ' + pkg.name + '@' + pkg.version + '\n\n- npm registry latest: ' + latest + '\n- published from: maintainer machine (this workflow does not publish)\n'
              );
            }
          })();
          "

      # Written to a file and passed with body_path: percent-escaping the
      # Markdown into a step output (the previous approach) is not decoded by
      # Actions, so the release body shipped literal %0A instead of newlines.
      - name: Extract release notes from CHANGELOG.md
        if: ${{ !inputs.dry_run }}
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = '## [' + pkg.version + ']';
          const start = changelog.indexOf(heading);
          if (start === -1) { console.error('No changelog entry'); process.exit(1); }
          const next = changelog.indexOf('\n## [', start + heading.length);
          const body = (next === -1 ? changelog.slice(start) : changelog.slice(start, next)).trim();
          fs.writeFileSync('release-notes.md', body + '\n');
          console.log('Release notes: ' + body.split('\n').length + ' lines from ' + heading);
          "

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
